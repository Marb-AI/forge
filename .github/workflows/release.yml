name: Release

# Push a tag like v0.1.1 and this builds every binary and publishes the release.
# Runs on macOS so the darwin binaries can be code-signed — an unsigned/
# linker-signed cross-compiled binary is killed by Apple Silicon's AMFI
# ("killed: 9"). macOS runners are free for public repos.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # The tag is passed in rather than left to `git describe`: the binaries carry
      # this string and answer `forge version` with it, so it must be the tag
      # being published and not whatever the checkout happens to be able to
      # describe.
      - name: Build release binaries
        run: make release VERSION="$GITHUB_REF_NAME"   # embeds the linux agent; darwin built natively, linux/windows cross-compiled

      - name: Ad-hoc sign macOS binaries
        run: |
          for b in dist/forge-darwin-amd64 dist/forge-darwin-arm64; do
            codesign --force --sign - "$b"
            codesign -dv "$b" 2>&1 | grep -i 'Signature' || true
          done

      # The desktop app, zipped into dist/ so the publish step below picks it up
      # with everything else. It signs itself (build/bundle.sh), because a bundle
      # is signed as a bundle rather than as the binary inside it.
      - name: Build Forge.app
        run: make app-zip VERSION="$GITHUB_REF_NAME"

      # Two things this decides, both from the tag and a file, so that publishing
      # is `git push origin <tag>` and nothing else:
      #
      #   * A tag with a hyphen in it is a pre-release — semver's own mark for
      #     "not final" (v1.2.3-rc.1). Without --prerelease GitHub would serve it
      #     as `releases/latest`, and every `curl … | sh` in the world installs
      #     whatever that points at.
      #   * Notes come from .github/release-notes/<tag>.md when there is one, and
      #     its `# ` heading becomes the title. A release worth writing about is
      #     worth writing about in the repository, reviewed with the code it
      #     describes; --generate-notes stays the answer for the ones that are not.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes=".github/release-notes/$tag.md"
          title="forge $tag"
          body="$RUNNER_TEMP/body.md"

          if [ -f "$notes" ]; then
            if [ "$(head -1 "$notes" | cut -c1-2)" = "# " ]; then
              title=$(head -1 "$notes" | cut -c3-)
              tail -n +2 "$notes" > "$body"
            else
              cp "$notes" "$body"
            fi
            set -- --notes-file "$body"
          else
            set -- --generate-notes
          fi

          case "$tag" in
            *-*) set -- "$@" --prerelease ;;
          esac

          gh release create "$tag" ./dist/* --title "$title" "$@"
